# ─── BizMatch — Netlify configuration ────────────────────────────────────────
# Place this file at the repo ROOT so Netlify picks it up automatically
# on every push to GitHub — no dashboard config needed.

[build]
  # Run all build commands from the frontend folder
  base    = "frontend"
  command = "npx expo export -p web"
  publish = "dist"

# ─── Environment variables ───────────────────────────────────────────────────
# Non-secret build-time variables.
# Secret values (EXPO_TOKEN etc.) must be set in the Netlify dashboard.
[build.environment]
  NODE_VERSION = "20"
  # Supabase URL + publishable key are safe in client bundles (not secrets) —
  # required at build time since Expo inlines EXPO_PUBLIC_* vars statically.
  EXPO_PUBLIC_SUPABASE_URL = "https://eoawnewluibnrqpznqxd.supabase.co"
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ybwelgBUBVdowTy_qM91Cw_cJOQtbiR"

# ─── SPA routing ─────────────────────────────────────────────────────────────
# All paths fall back to index.html so React Navigation handles routing.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ─── Security headers (applied to every response) ────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
